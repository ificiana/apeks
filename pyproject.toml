[project]
name = "apeks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ificiana", email = "ificiana@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.8",
    "scipy>=1.18.1",
]

[project.scripts]
apeks = "apeks.app:main"
apeks-run = "apeks.runner:main"
replay = "apeks.replay:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=apeks --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["apeks"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
